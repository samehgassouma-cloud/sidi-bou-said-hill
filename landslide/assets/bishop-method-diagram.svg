<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="IBM Plex Sans Arabic, Segoe UI, Tahoma, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="600" fill="#F6F8FA"/>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1F5FA8" direction="rtl">طريقة Bishop المبسّطة — دائرة الانزلاق والشرائح</text>
  <text x="400" y="68" text-anchor="middle" font-size="15" fill="#4F6577">Méthode de Bishop simplifiée · Simplified Bishop method</text>
  <polygon points="40,430 230,430 470,250 760,250 760,480 40,480" fill="#B98A52"/>
  <polygon points="40,480 760,480 760,520 40,520" fill="#6E5A48"/>
  <rect x="40" y="430" width="190" height="90" fill="#1C5A86" fill-opacity=".6"/>
  <path d="M40 430 L230 430 L470 330 L760 330" fill="none" stroke="#2E7BD0" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="330" cy="110" r="5" fill="#A8285F"/>
  <text x="340" y="104" font-size="15" font-weight="700" fill="#A8285F">O (xc, yc)</text>
  <path d="M 233 428 A 330 330 0 0 0 640 250" fill="none" stroke="#A8285F" stroke-width="3"/>
  <line x1="330" y1="110" x2="640" y2="250" stroke="#A8285F" stroke-dasharray="4 4"/>
  <text x="480" y="170" font-size="15" font-weight="700" fill="#A8285F">R</text>
  <g stroke="#12304A" stroke-width="1" fill="none" opacity=".7">
    <line x1="290" y1="387" x2="290" y2="435"/><line x1="350" y1="342" x2="350" y2="438"/>
    <line x1="410" y1="296" x2="410" y2="433"/><line x1="470" y1="250" x2="470" y2="420"/>
    <line x1="530" y1="250" x2="530" y2="396"/><line x1="590" y1="250" x2="590" y2="352"/>
  </g>
  <rect x="470" y="250" width="60" height="160" fill="#FFFFFF" fill-opacity=".35" stroke="#12304A" stroke-width="2"/>
  <line x1="500" y1="320" x2="500" y2="380" stroke="#12304A" stroke-width="3"/>
  <polygon points="494,374 506,374 500,388" fill="#12304A"/>
  <text x="508" y="360" font-size="15" font-weight="700" fill="#12304A">W</text>
  <line x1="500" y1="320" x2="455" y2="320" stroke="#D09A1E" stroke-width="3"/>
  <polygon points="458,314 458,326 444,320" fill="#D09A1E"/>
  <text x="400" y="315" font-size="14" font-weight="700" fill="#8A5E00">kh·W</text>
  <text x="498" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#12304A">b</text>
  <text x="545" y="412" font-size="14" font-weight="700" fill="#12304A">α</text>
  <text x="600" y="300" font-size="14" font-weight="700" fill="#2E7BD0">u</text>
  <rect x="40" y="538" width="720" height="48" rx="10" fill="#FFFFFF" stroke="#C9D6E2"/>
  <text x="400" y="560" text-anchor="middle" font-size="15" font-weight="700" fill="#12304A">F = Σ[(c′b + (W − ub)tanφ′)/mα] ÷ Σ[W sinα + kh W (yc − yg)/R]</text>
  <text x="400" y="580" text-anchor="middle" font-size="12" fill="#4F6577" direction="rtl">الأستاذة سماح قسومة — مدرّبة دولية · أداة تقديرية لا تُغني عن الدراسة الميدانية</text>
</svg>
