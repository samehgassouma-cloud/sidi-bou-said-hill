<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="IBM Plex Sans Arabic, Segoe UI, Tahoma, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="520" fill="#F6F8FA"/>
  <text x="400" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1F5FA8" direction="rtl">سلّم معامل الأمان</text>
  <text x="400" y="70" text-anchor="middle" font-size="15" fill="#4F6577">Échelle du coefficient de sécurité · Factor of safety scale</text>
  <rect x="60" y="110" width="220" height="40" fill="#A8285F"/>
  <rect x="280" y="110" width="110" height="40" fill="#E0A21A"/>
  <rect x="390" y="110" width="350" height="40" fill="#3F7A3A"/>
  <g font-size="15" font-weight="700" fill="#12304A" text-anchor="middle">
    <line x1="280" y1="100" x2="280" y2="162" stroke="#12304A" stroke-width="2"/><text x="280" y="182">1.0</text>
    <line x1="390" y1="100" x2="390" y2="162" stroke="#12304A" stroke-width="2"/><text x="390" y="182">1.2</text>
    <text x="60" y="182">0</text><text x="740" y="182">2.0+</text>
  </g>
  <g font-size="14" fill="#12304A">
    <rect x="40" y="210" width="230" height="150" rx="10" fill="#F8DDE8"/>
    <text x="255" y="238" text-anchor="start" font-weight="700" fill="#A8285F" direction="rtl">انهيار FoS &lt; 1</text>
    <text x="55" y="264" font-weight="700" fill="#A8285F">Rupture · Failure</text>
    <text x="255" y="294" text-anchor="start" direction="rtl">القوة الدافعة تغلب المقاومة</text>
    <text x="55" y="320">Le sol glisse</text>
    <text x="55" y="342">The layer slides</text>
    <rect x="285" y="210" width="230" height="150" rx="10" fill="#FBF0D4"/>
    <text x="500" y="238" text-anchor="start" font-weight="700" fill="#9A6A00" direction="rtl">حرج 1 – 1.2</text>
    <text x="300" y="264" font-weight="700" fill="#9A6A00">Critique · Critical</text>
    <text x="500" y="294" text-anchor="start" direction="rtl">شقوق عند الحافة ومراقبة</text>
    <text x="300" y="320">Fissures en crête</text>
    <text x="300" y="342">Crest cracks, monitor</text>
    <rect x="530" y="210" width="230" height="150" rx="10" fill="#E3F0DF"/>
    <text x="745" y="238" text-anchor="start" font-weight="700" fill="#3F7A3A" direction="rtl">مستقر FoS ≥ 1.2</text>
    <text x="545" y="264" font-weight="700" fill="#3F7A3A">Stable</text>
    <text x="745" y="294" text-anchor="start" direction="rtl">هامش أمان كافٍ</text>
    <text x="545" y="320">Marge suffisante</text>
    <text x="545" y="342">Adequate margin</text>
  </g>
  <rect x="40" y="385" width="720" height="95" rx="10" fill="#FFFFFF" stroke="#C9D6E2"/>
  <g font-size="14" fill="#12304A">
    <text x="745" y="412" text-anchor="start" direction="rtl">↓ يُنقص FoS : الماء، حمولة المباني، زيادة الميل</text>
    <text x="745" y="438" text-anchor="start" direction="rtl">↑ يرفع FoS : التماسك، الاحتكاك، الصرف الجيد</text>
    <text x="55" y="464">FR : eau, charge, pente ↓ — cohésion, frottement, drainage ↑ · EN : water, load, slope ↓ — cohesion, friction, drainage ↑</text>
  </g>
  <text x="400" y="506" text-anchor="middle" font-size="13" fill="#4F6577" direction="rtl">الأستاذة سماح قسومة — مدرّبة دولية</text>
</svg>
