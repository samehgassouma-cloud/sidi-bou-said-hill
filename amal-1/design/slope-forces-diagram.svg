  <path d="M 230 470 A 70 70 0 0 0 225 440" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="240" y="462" font-size="16" font-weight="700" fill="#fff">β</text>
  <g font-size="14" fill="#12304A">
    <rect x="470" y="330" width="300" height="118" rx="10" fill="#FFFFFF" stroke="#C9D6E2"/>
    <text x="760" y="354" text-anchor="start" direction="rtl">W : وزن التربة + المباني</text>
    <text x="760" y="378" text-anchor="start" direction="rtl">u : ضغط الماء (الأزرق)</text>
    <text x="485" y="404">W : poids · weight   u : eau · water</text>
    <text x="485" y="430" font-weight="700">FoS = [c′ + (σ − u)·tanφ′] ÷ τ</text>
  </g>
  <text x="400" y="535" text-anchor="middle" font-size="13" fill="#DCE8F5" direction="rtl">الأستاذة سماح قسومة — مدرّبة دولية</text>
