  <text x="400" y="68" text-anchor="middle" font-size="15" fill="#4F6577">Forces agissant sur une pente · Forces acting on a slope</text>
  <polygon points="80,470 720,470 720,150 620,150" fill="#6E5A48"/>
  <polygon points="620,150 160,420 185,455 650,185" fill="#B98A52"/>
  <polygon points="200,432 185,455 650,185 640,168" fill="#2878C8" fill-opacity=".35"/>
  <rect x="0" y="470" width="800" height="90" fill="#1C5A86"/>
  <g transform="translate(360,290)">
    <circle r="7" fill="#12304A"/>
    <line x1="0" y1="0" x2="0" y2="110" stroke="#12304A" stroke-width="4"/>
    <polygon points="-8,104 8,104 0,122" fill="#12304A"/>
    <text x="12" y="118" font-size="16" font-weight="700" fill="#12304A">W</text>
    <line x1="0" y1="0" x2="-86" y2="50" stroke="#A8285F" stroke-width="4"/>
    <polygon points="-80,40 -90,57 -100,57" fill="#A8285F"/>
    <text x="-150" y="80" font-size="15" font-weight="700" fill="#A8285F">τ (driving)</text>
    <line x1="0" y1="0" x2="72" y2="-42" stroke="#3F7A3A" stroke-width="4"/>
    <polygon points="68,-52 86,-50 76,-34" fill="#3F7A3A"/>
    <text x="84" y="-54" font-size="15" font-weight="700" fill="#3F7A3A">c′ + σ′·tanφ′</text>
    <line x1="0" y1="0" x2="45" y2="78" stroke="#1F5FA8" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="50" y="96" font-size="15" font-weight="700" fill="#1F5FA8">σ − u</text>
