<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="IBM Plex Sans Arabic, Segoe UI, Tahoma, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="560" fill="#F6F8FA"/>
