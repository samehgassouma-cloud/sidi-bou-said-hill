<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="IBM Plex Sans Arabic, Segoe UI, Tahoma, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="620" fill="#F6F8FA"/>
  <text x="400" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1F5FA8" direction="rtl">علامات خطر الانزلاق</text>
  <text x="400" y="72" text-anchor="middle" font-size="15" fill="#4F6577">Signes de glissement · Landslide warning signs</text>
  <g font-size="14" fill="#12304A">
    <!-- 1 crack -->
    <g transform="translate(40,100)"><rect width="230" height="200" rx="12" fill="#FFF" stroke="#C9D6E2"/>
      <rect x="65" y="22" width="100" height="80" fill="#EEF2F5" stroke="#9AA8B4"/>
      <polyline points="110,22 104,45 116,60 106,82 112,102" fill="none" stroke="#A8285F" stroke-width="3"/>
      <text x="215" y="132" text-anchor="start" font-weight="700" direction="rtl">شقوق جديدة تتّسع</text>
      <text x="15" y="158">Fissures qui s'élargissent</text><text x="15" y="182">Widening cracks</text></g>
    <!-- 2 tilt -->
    <g transform="translate(285,100)"><rect width="230" height="200" rx="12" fill="#FFF" stroke="#C9D6E2"/>
      <line x1="80" y1="102" x2="150" y2="102" stroke="#6E5A48" stroke-width="3"/>
      <line x1="100" y1="102" x2="125" y2="25" stroke="#1F5FA8" stroke-width="6"/>
      <line x1="115" y1="102" x2="115" y2="25" stroke="#9AA8B4" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="215" y="132" text-anchor="start" font-weight="700" direction="rtl">ميلان جدران وأعمدة</text>
      <text x="15" y="158">Murs et poteaux qui penchent</text><text x="15" y="182">Tilting walls and poles</text></g>
    <!-- 3 door -->
    <g transform="translate(530,100)"><rect width="230" height="200" rx="12" fill="#FFF" stroke="#C9D6E2"/>
      <rect x="85" y="20" width="60" height="84" fill="none" stroke="#9AA8B4" stroke-width="3"/>
      <polygon points="88,24 140,30 142,102 88,101" fill="#1F5FA8"/>
      <text x="215" y="132" text-anchor="start" font-weight="700" direction="rtl">أبواب ونوافذ تعلق</text>
      <text x="15" y="158">Portes qui coincent</text><text x="15" y="182">Sticking doors, windows</text></g>
    <!-- 4 water -->
    <g transform="translate(40,320)"><rect width="230" height="200" rx="12" fill="#FFF" stroke="#C9D6E2"/>
      <rect x="55" y="50" width="50" height="16" fill="#9AA8B4"/><rect x="125" y="50" width="50" height="16" fill="#9AA8B4"/>
      <path d="M110 70 q5 14 0 22 q-5 -8 0 -22 M122 72 q5 14 0 22 q-5 -8 0 -22" fill="#2E7BD0"/>
      <text x="215" y="132" text-anchor="start" font-weight="700" direction="rtl">تسرّب ماء أو تطهير</text>
      <text x="15" y="158">Fuites d'eau, égouts</text><text x="15" y="182">Water or sewer leaks</text></g>
    <!-- 5 ground -->
    <g transform="translate(285,320)"><rect width="230" height="200" rx="12" fill="#FFF" stroke="#C9D6E2"/>
      <path d="M40 90 L95 90 L110 70 L125 100 L190 100" fill="none" stroke="#6E5A48" stroke-width="4"/>
      <rect x="140" y="55" width="40" height="45" fill="#EEF2F5" stroke="#9AA8B4"/>
      <text x="215" y="132" text-anchor="start" font-weight="700" direction="rtl">هبوط أو انتفاخ الأرض</text>
      <text x="15" y="158">Sol qui s'affaisse</text><text x="15" y="182">Ground sinking or bulging</text></g>
    <!-- 6 rocks -->
    <g transform="translate(530,320)"><rect width="230" height="200" rx="12" fill="#FFF" stroke="#C9D6E2"/>
      <polygon points="60,30 160,30 160,105 60,105" fill="#B98A52"/>
      <polygon points="160,30 200,105 160,105" fill="#F6F8FA"/>
      <circle cx="178" cy="62" r="6" fill="#6E5A48"/><circle cx="190" cy="85" r="4" fill="#6E5A48"/>
      <path d="M120 20 l8 -8 M132 22 l10 -4" stroke="#A8285F" stroke-width="2.5"/>
      <text x="215" y="132" text-anchor="start" font-weight="700" direction="rtl">تشقّق وتساقط حجارة</text>
      <text x="15" y="158">Craquements, chutes de pierres</text><text x="15" y="182">Cracking, falling stones</text></g>
  </g>
  <rect x="40" y="540" width="720" height="50" rx="12" fill="#F8DDE8"/>
  <text x="740" y="572" text-anchor="start" font-size="17" font-weight="700" fill="#A8285F" direction="rtl">غادر فورًا واتصل بالحماية المدنية 198</text>
  <text x="60" y="572" font-size="14" fill="#A8285F">Protection civile · Civil Protection : 198</text>
  <text x="400" y="610" text-anchor="middle" font-size="12" fill="#4F6577" direction="rtl">الأستاذة سماح قسومة — مدرّبة دولية</text>
</svg>
