<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%"
     role="img" aria-label="Parcours utilisateur — de la question au fait vérifié">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#123A5C"/>
    </marker>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="#FAF7F0"/>
  <text x="60" y="64" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#123A5C">Parcours — de la question au fait vérifié</text>
  <text x="60" y="92" font-family="'Noto Naskh Arabic', serif" font-size="16" fill="#5A6570">مسار المستخدم — من السؤال إلى المعلومة المؤكّدة</text>

  <!-- ligne 1 -->
  <g font-family="system-ui, sans-serif">
    <g>
      <rect x="60" y="140" width="210" height="96" rx="16" fill="url(#node)" stroke="#123A5C" stroke-width="1.5"/>
      <text x="84" y="176" font-size="15" font-weight="600" fill="#123A5C">1 · Arrivée</text>
      <text x="84" y="200" font-size="12" fill="#5A6570">Choix de langue</text>
      <text x="84" y="220" font-size="12" fill="#5A6570">AR (RTL) · FR · EN</text>
    </g>
    <path d="M270 188 H330" stroke="#123A5C" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="340" y="140" width="210" height="96" rx="16" fill="url(#node)" stroke="#123A5C" stroke-width="1.5"/>
      <text x="364" y="176" font-size="15" font-weight="600" fill="#123A5C">2 · Question</text>
      <text x="364" y="200" font-size="12" fill="#5A6570">Saisie texte ou voix</text>
      <text x="364" y="220" font-size="12" fill="#5A6570">4 suggestions de départ</text>
    </g>
    <path d="M550 188 H610" stroke="#123A5C" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="620" y="140" width="230" height="96" rx="16" fill="url(#node)" stroke="#123A5C" stroke-width="1.5"/>
      <text x="644" y="176" font-size="15" font-weight="600" fill="#123A5C">3 · Routage</text>
      <text x="644" y="200" font-size="12" fill="#5A6570">Patrimoine · Événements</text>
      <text x="644" y="220" font-size="12" fill="#5A6570">Pratique · Hors périmètre</text>
    </g>
    <path d="M850 188 H910" stroke="#123A5C" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="920" y="140" width="220" height="96" rx="16" fill="#F6EEDA" stroke="#C9A227" stroke-width="1.5"/>
      <text x="944" y="176" font-size="15" font-weight="600" fill="#7A5C10">4 · Contrôle de fiabilité</text>
      <text x="944" y="200" font-size="12" fill="#8A6A12">Chaque fait porte un statut</text>
      <text x="944" y="220" font-size="12" fill="#8A6A12">avant affichage</text>
    </g>
  </g>

  <!-- descente vers les 3 statuts -->
  <path d="M1030 236 V300 H600" stroke="#C9A227" stroke-width="2" fill="none"/>
  <path d="M600 300 V340" stroke="#C9A227" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <g font-family="system-ui, sans-serif">
    <g>
      <rect x="150" y="360" width="270" height="120" rx="16" fill="#E7F1F8" stroke="#2E7BB5" stroke-width="1.5"/>
      <text x="176" y="396" font-size="15" font-weight="600" fill="#1B5C86">✓ مؤكّد · Vérifié</text>
      <text x="176" y="422" font-size="12" fill="#1B5C86">Affiché normalement</text>
      <text x="176" y="444" font-size="12" fill="#1B5C86">+ lien vers la source</text>
      <text x="176" y="466" font-size="11" fill="#5A6570">ex. décret du 28 août 1915</text>
    </g>
    <g>
      <rect x="465" y="360" width="270" height="120" rx="16" fill="#FFF3D6" stroke="#C9A227" stroke-width="1.5"/>
      <text x="491" y="396" font-size="15" font-weight="600" fill="#8A6A12">⚠ يتطلب تحقق · À vérifier</text>
      <text x="491" y="422" font-size="12" fill="#8A6A12">Affiché avec badge visible</text>
      <text x="491" y="444" font-size="12" fill="#8A6A12">Jamais présenté comme certain</text>
      <text x="491" y="466" font-size="11" fill="#5A6570">ex. horaires, tarifs, ateliers</text>
    </g>
    <g>
      <rect x="780" y="360" width="270" height="120" rx="16" fill="#F7E9E9" stroke="#B4534F" stroke-width="1.5"/>
      <text x="806" y="396" font-size="15" font-weight="600" fill="#8E3A36">🚫 مرفوض · Refusé</text>
      <text x="806" y="422" font-size="12" fill="#8E3A36">Retiré de la réponse</text>
      <text x="806" y="444" font-size="12" fill="#8E3A36">Le guide dit qu'il ne sait pas</text>
      <text x="806" y="466" font-size="11" fill="#5A6570">ex. « souk » inexistant sur place</text>
    </g>
  </g>

  <path d="M285 480 V540 H600" stroke="#123A5C" stroke-width="2" fill="none"/>
  <path d="M600 480 V540" stroke="#123A5C" stroke-width="2" fill="none"/>
  <path d="M915 480 V540 H600" stroke="#123A5C" stroke-width="2" fill="none"/>
  <path d="M600 540 V580" stroke="#123A5C" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <g font-family="system-ui, sans-serif">
    <rect x="380" y="596" width="440" height="72" rx="16" fill="url(#node)" stroke="#123A5C" stroke-width="1.5"/>
    <text x="410" y="630" font-size="15" font-weight="600" fill="#123A5C">5 · Réponse + action</text>
    <text x="410" y="654" font-size="12" fill="#5A6570">Carte · rappel · fiche patrimoine · question de relance</text>
  </g>
</svg>
