<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" width="100%" height="100%"
     role="img" aria-label="Chat screen — English LTR version — Rafik Sidi Bou Saïd">
  <defs>
    <linearGradient id="hdr2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123A5C"/>
      <stop offset="1" stop-color="#2E7BB5"/>
    </linearGradient>
    <linearGradient id="ai2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF2F9"/>
      <stop offset="1" stop-color="#F6EEDA"/>
    </linearGradient>
    <pattern id="lattice" width="48" height="48" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#2E7BB5" stroke-width="1" opacity="0.22">
        <path d="M0 24 L24 0 L48 24 L24 48 Z"/>
        <circle cx="24" cy="24" r="7"/>
      </g>
    </pattern>
  </defs>

  <rect width="420" height="900" fill="#FAF7F0"/>
  <rect y="184" width="420" height="560" fill="url(#lattice)"/>

  <!-- header -->
  <rect width="420" height="150" fill="url(#hdr2)"/>
  <rect y="146" width="420" height="4" fill="#C9A227"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.22">
    <path d="M40 150 V96 a30 30 0 0 1 60 0 V150"/>
    <path d="M320 150 V96 a30 30 0 0 1 60 0 V150"/>
  </g>
  <g>
    <circle cx="50" cy="58" r="24" fill="#F6EEDA" stroke="#C9A227" stroke-width="2"/>
    <path d="M36 68 v-12 a14 14 0 0 1 28 0 v12 z" fill="#2E7BB5"/>
    <path d="M44 68 v-9 a6 6 0 0 1 12 0 v9 z" fill="#F6EEDA"/>
    <circle cx="50" cy="40" r="3" fill="#C9A227"/>
  </g>
  <text x="84" y="42" font-family="system-ui, sans-serif" font-size="18" font-weight="700"
        letter-spacing="0.5" fill="#FFFFFF">RAFIK SIDI BOU SAÏD</text>
  <text x="84" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#D8E6F2">SIDI BOU SAÏD COMPANION · AI GUIDE</text>
  <text x="84" y="84" font-family="system-ui, sans-serif" font-size="11" fill="#E3C567">Discovering Tunisian culture</text>
  <g>
    <rect x="314" y="44" width="82" height="28" rx="14" fill="#FFFFFF" opacity="0.18"/>
    <text x="355" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#FFFFFF">EN · FR · ع</text>
  </g>
  <rect x="0" y="150" width="420" height="34" fill="#F6EEDA"/>
  <text x="24" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#7A5C10">★ UNESCO World Heritage List — inscribed 25 July 2026</text>

  <!-- guide bubble 1 -->
  <g>
    <path d="M32 204 h280 a16 16 0 0 1 16 16 v72 a16 16 0 0 1 -16 16 h-268 l-12 14 v-14 a16 16 0 0 1 -16 -16 v-72 a16 16 0 0 1 16 -16 z"
          fill="url(#ai2)" stroke="#C9A227" stroke-width="1"/>
    <text font-family="system-ui, sans-serif" font-size="12.5" fill="#123A5C">
      <tspan x="46" y="232">Welcome to Sidi Bou Saïd. I'm your AI cultural</tspan>
      <tspan x="46" y="252">guide — heritage sites, or today's Arts</tspan>
      <tspan x="46" y="272">Conference programme?</tspan>
    </text>
  </g>
  <!-- user bubble -->
  <g>
    <rect x="146" y="330" width="250" height="52" rx="16" fill="#E9EBEE"/>
    <text font-family="system-ui, sans-serif" font-size="12.5" fill="#2A2A2A">
      <tspan x="164" y="352">What events are happening today</tspan>
      <tspan x="164" y="372">for the Arts Conference?</tspan>
    </text>
  </g>
  <!-- guide bubble 2 with verification badge -->
  <g>
    <path d="M32 402 h304 a16 16 0 0 1 16 16 v122 a16 16 0 0 1 -16 16 h-292 l-12 14 v-14 a16 16 0 0 1 -16 -16 v-122 a16 16 0 0 1 16 -16 z"
          fill="url(#ai2)" stroke="#C9A227" stroke-width="1"/>
    <text font-family="system-ui, sans-serif" font-size="12.5" fill="#123A5C">
      <tspan x="46" y="430">A digital art workshop starts in 30 minutes,</tspan>
      <tspan x="46" y="450">and an exhibition opens near Sidi Chabâane.</tspan>
    </text>
    <g>
      <rect x="46" y="466" width="206" height="26" rx="13" fill="#FFF3D6" stroke="#C9A227" stroke-width="1"/>
      <text x="60" y="484" font-family="system-ui, sans-serif" font-size="10.5" fill="#8A6A12">⚠ Schedule not confirmed — to verify</text>
    </g>
    <g font-family="system-ui, sans-serif" font-size="11.5">
      <rect x="46" y="506" width="112" height="30" rx="15" fill="#123A5C"/>
      <text x="102" y="526" text-anchor="middle" fill="#FFFFFF">Show map</text>
      <rect x="168" y="506" width="104" height="30" rx="15" fill="none" stroke="#123A5C"/>
      <text x="220" y="526" text-anchor="middle" fill="#123A5C">Remind me</text>
    </g>
  </g>
  <!-- user bubble 2 -->
  <g>
    <rect x="124" y="580" width="272" height="52" rx="16" fill="#E9EBEE"/>
    <text font-family="system-ui, sans-serif" font-size="12.5" fill="#2A2A2A">
      <tspan x="142" y="602">Tell me about the patterned blue</tspan>
      <tspan x="142" y="622">doors of Sidi Bou Saïd.</tspan>
    </text>
  </g>
  <!-- guide bubble 3, sourced fact -->
  <g>
    <path d="M32 652 h304 a16 16 0 0 1 16 16 v78 a16 16 0 0 1 -16 16 h-292 l-12 14 v-14 a16 16 0 0 1 -16 -16 v-78 a16 16 0 0 1 16 -16 z"
          fill="url(#ai2)" stroke="#C9A227" stroke-width="1"/>
    <text font-family="system-ui, sans-serif" font-size="12.5" fill="#123A5C">
      <tspan x="46" y="680">The blue-and-white palette was imposed by a</tspan>
      <tspan x="46" y="700">decree of 28 August 1915, pushed by Baron</tspan>
      <tspan x="46" y="720">Rodolphe d'Erlanger.</tspan>
      <tspan x="46" y="740" fill="#2E7BB5">✓ Verified — tap for source</tspan>
    </text>
  </g>

  <!-- input area -->
  <rect x="0" y="770" width="420" height="130" fill="#FFFFFF"/>
  <g fill="none" stroke="#123A5C" stroke-width="1.2" opacity="0.28">
    <path d="M18 848 v-26 a14 14 0 0 1 28 0 v26"/>
    <path d="M25 848 v-20 a7 7 0 0 1 14 0 v20"/>
    <path d="M382 848 c-14 0 -20 -10 -20 -19 c0 -9 6 -13 6 -18 h28 c0 5 6 9 6 18 c0 9 -6 19 -20 19 z"/>
    <path d="M368 819 h28"/>
    <path d="M370 838 q12 -6 24 0"/>
  </g>
  <rect x="24" y="792" width="310" height="46" rx="23" fill="#F2F4F6" stroke="#D5DCE3"/>
  <text x="52" y="820" font-family="system-ui, sans-serif" font-size="12.5" fill="#8A939B">Ask about Tunisian culture…</text>
  <g stroke="#123A5C" stroke-width="1.6" fill="none">
    <rect x="298" y="804" width="10" height="16" rx="5"/>
    <path d="M293 816 a10 10 0 0 0 20 0"/>
    <path d="M303 826 v6"/>
  </g>
  <circle cx="371" cy="815" r="19" fill="#C9A227"/>
  <path d="M363 815 l16 -7 v5 l-9 2 l9 2 v5 z" fill="#FFFFFF"/>

  <!-- bottom navigation -->
  <rect x="0" y="856" width="420" height="44" fill="#123A5C"/>
  <g font-family="system-ui, sans-serif" font-size="9.5" fill="#D8E6F2" text-anchor="middle">
    <g>
      <path d="M38 872 l10 -8 l10 8 v10 h-20 z" fill="none" stroke="#E3C567" stroke-width="1.4"/>
      <text x="48" y="894" fill="#E3C567">Home</text>
    </g>
    <g>
      <rect x="138" y="866" width="20" height="16" rx="3" fill="none" stroke="#D8E6F2" stroke-width="1.4"/>
      <path d="M138 872 h20" stroke="#D8E6F2" stroke-width="1.4"/>
      <text x="148" y="894">Events</text>
    </g>
    <g>
      <path d="M262 882 v-12 a3 3 0 0 1 3 -3 h16 a3 3 0 0 1 3 3 v8 a3 3 0 0 1 -3 3 h-11 z"
            fill="none" stroke="#D8E6F2" stroke-width="1.4"/>
      <text x="272" y="894">Chat</text>
    </g>
    <g>
      <circle cx="372" cy="871" r="5" fill="none" stroke="#D8E6F2" stroke-width="1.4"/>
      <path d="M363 883 a9 9 0 0 1 18 0" fill="none" stroke="#D8E6F2" stroke-width="1.4"/>
      <text x="372" y="894">Profile</text>
    </g>
  </g>
</svg>
