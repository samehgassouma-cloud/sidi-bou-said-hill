<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" width="100%" height="100%"
     role="img" aria-label="Écran de conversation — version arabe RTL — رفيق سيدي بوسعيد">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123A5C"/>
      <stop offset="1" stop-color="#2E7BB5"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF2F9"/>
      <stop offset="1" stop-color="#F6EEDA"/>
    </linearGradient>
    <!-- motif géométrique original : étoile à huit branches simplifiée -->
    <pattern id="star8" width="56" height="56" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#C9A227" stroke-width="1" opacity="0.30">
        <path d="M28 6 L38 18 L50 28 L38 38 L28 50 L18 38 L6 28 L18 18 Z"/>
        <rect x="14" y="14" width="28" height="28" transform="rotate(45 28 28)"/>
      </g>
    </pattern>
  </defs>

  <!-- fond -->
  <rect width="420" height="900" fill="#FAF7F0"/>
  <rect y="120" width="420" height="620" fill="url(#star8)" opacity="0.5"/>

  <!-- ===== en-tête ===== -->
  <rect width="420" height="150" fill="url(#hdr)"/>
  <rect y="146" width="420" height="4" fill="#C9A227"/>
  <!-- arcade stylisée, en filigrane -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.22">
    <path d="M40 150 V96 a30 30 0 0 1 60 0 V150"/>
    <path d="M320 150 V96 a30 30 0 0 1 60 0 V150"/>
  </g>

  <!-- avatar du guide (aligné à droite en RTL) -->
  <g>
    <circle cx="370" cy="58" r="24" fill="#F6EEDA" stroke="#C9A227" stroke-width="2"/>
    <!-- coupole + croissant de porte, dessin original -->
    <path d="M356 68 v-12 a14 14 0 0 1 28 0 v12 z" fill="#2E7BB5"/>
    <path d="M364 68 v-9 a6 6 0 0 1 12 0 v9 z" fill="#F6EEDA"/>
    <circle cx="370" cy="40" r="3" fill="#C9A227"/>
  </g>
  <text x="336" y="42" direction="rtl" text-anchor="end" font-family="'Noto Naskh Arabic', serif"
        font-size="21" font-weight="700" fill="#FFFFFF">رفيق سيدي بوسعيد</text>
  <text x="336" y="64" direction="rtl" text-anchor="end" font-family="'Noto Naskh Arabic', serif"
        font-size="12" fill="#D8E6F2">الدليل الثقافي بالذكاء الاصطناعي</text>
  <text x="336" y="86" direction="rtl" text-anchor="end" font-family="'Noto Naskh Arabic', serif"
        font-size="11" fill="#E3C567">اكتشف ثقافة تونس</text>
  <!-- sélecteur de langue -->
  <g>
    <rect x="24" y="44" width="82" height="28" rx="14" fill="#FFFFFF" opacity="0.18"/>
    <text x="65" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#FFFFFF">ع · FR · EN</text>
  </g>
  <!-- bandeau UNESCO (fait vérifié) -->
  <rect x="0" y="150" width="420" height="34" fill="#F6EEDA"/>
  <text x="396" y="172" direction="rtl" text-anchor="end" font-family="'Noto Naskh Arabic', serif"
        font-size="12" fill="#7A5C10">★ مُدرَج على قائمة اليونسكو للتراث العالمي — 25 جويلية 2026</text>

  <!-- ===== fil de conversation ===== -->
  <!-- bulle guide 1 -->
  <g>
    <path d="M108 204 h280 a16 16 0 0 1 16 16 v72 a16 16 0 0 1 -16 16 h-268 l-12 14 v-14 a16 16 0 0 1 -16 -16 v-72 a16 16 0 0 1 16 -16 z"
          fill="url(#ai)" stroke="#C9A227" stroke-width="1"/>
    <text direction="rtl" text-anchor="end" font-family="'Noto Naskh Arabic', serif" font-size="13" fill="#123A5C">
      <tspan x="374" y="232">أهلاً بك في سيدي بوسعيد! أنا رفيقك الثقافي.</tspan>
      <tspan x="374" y="256">نبدأ بالمواقع التراثية ولّا ببرنامج ملتقى الفنون؟</tspan>
      <tspan x="374" y="280" fill="#7A5C10">القرية مُدرجة على قائمة اليونسكو منذ جويلية 2026.</tspan>
    </text>
  </g>
  <!-- bulle utilisateur -->
  <g>
    <rect x="24" y="330" width="250" height="52" rx="16" fill="#E9EBEE"/>
    <text direction="rtl" text-anchor="end" font-family="'Noto Naskh Arabic', serif" font-size="13" fill="#2A2A2A">
      <tspan x="256" y="352">شنوّة البرنامج متاع اليوم في</tspan>
      <tspan x="256" y="372">ملتقى الفنون؟</tspan>
    </text>
  </g>
  <!-- bulle guide 2 avec mention "à vérifier" -->
  <g>
    <path d="M84 402 h304 a16 16 0 0 1 16 16 v122 a16 16 0 0 1 -16 16 h-292 l-12 14 v-14 a16 16 0 0 1 -16 -16 v-122 a16 16 0 0 1 16 -16 z"
          fill="url(#ai)" stroke="#C9A227" stroke-width="1"/>
    <text direction="rtl" text-anchor="end" font-family="'Noto Naskh Arabic', serif" font-size="13" fill="#123A5C">
      <tspan x="374" y="430">اختيار موفّق. عندك ورشة فن رقمي بعد 30 دقيقة،</tspan>
      <tspan x="374" y="454">ومعرض في وسط القرية قرب برج سيدي الشعبان.</tspan>
    </text>
    <!-- badge de vérification : la donnée n'est pas confirmée -->
    <g>
      <rect x="176" y="466" width="198" height="26" rx="13" fill="#FFF3D6" stroke="#C9A227" stroke-width="1"/>
      <text x="362" y="484" direction="rtl" text-anchor="end" font-family="'Noto Naskh Arabic', serif"
            font-size="11" fill="#8A6A12">⚠ توقيت غير مؤكّد — يتطلّب تحقّق</text>
    </g>
    <!-- actions rapides -->
    <g font-family="'Noto Naskh Arabic', serif" font-size="12">
      <rect x="252" y="506" width="122" height="30" rx="15" fill="#123A5C"/>
      <text x="313" y="526" text-anchor="middle" fill="#FFFFFF">أرني الخريطة</text>
      <rect x="130" y="506" width="112" height="30" rx="15" fill="none" stroke="#123A5C"/>
      <text x="186" y="526" text-anchor="middle" fill="#123A5C">ذكّرني</text>
    </g>
  </g>
  <!-- bulle utilisateur 2 -->
  <g>
    <rect x="24" y="580" width="272" height="52" rx="16" fill="#E9EBEE"/>
    <text direction="rtl" text-anchor="end" font-family="'Noto Naskh Arabic', serif" font-size="13" fill="#2A2A2A">
      <tspan x="278" y="602">حدّثني على تاريخ الأبواب المزخرفة</tspan>
      <tspan x="278" y="622">في سيدي بوسعيد</tspan>
    </text>
  </g>
  <!-- bulle guide 3 (fait vérifié) -->
  <g>
    <path d="M84 652 h304 a16 16 0 0 1 16 16 v78 a16 16 0 0 1 -16 16 h-292 l-12 14 v-14 a16 16 0 0 1 -16 -16 v-78 a16 16 0 0 1 16 -16 z"
          fill="url(#ai)" stroke="#C9A227" stroke-width="1"/>
    <text direction="rtl" text-anchor="end" font-family="'Noto Naskh Arabic', serif" font-size="13" fill="#123A5C">
      <tspan x="374" y="680">الأزرق والأبيض فُرضا بأمر صادر في 28 أوت 1915</tspan>
      <tspan x="374" y="704">بمسعى من البارون رودولف ديرلنجي.</tspan>
      <tspan x="374" y="728" fill="#2E7BB5">✓ معلومة مؤكّدة — اضغط للمصدر</tspan>
    </text>
  </g>

  <!-- ===== zone de saisie ===== -->
  <rect x="0" y="770" width="420" height="130" fill="#FFFFFF"/>
  <!-- illustrations non colorées : arcade et poterie -->
  <g fill="none" stroke="#123A5C" stroke-width="1.2" opacity="0.28">
    <path d="M18 848 v-26 a14 14 0 0 1 28 0 v26"/>
    <path d="M25 848 v-20 a7 7 0 0 1 14 0 v20"/>
    <path d="M382 848 c-14 0 -20 -10 -20 -19 c0 -9 6 -13 6 -18 h28 c0 5 6 9 6 18 c0 9 -6 19 -20 19 z"/>
    <path d="M368 819 h28"/>
    <path d="M370 838 q12 -6 24 0"/>
  </g>
  <!-- champ de saisie (RTL : micro à gauche, envoi à droite inversé) -->
  <rect x="56" y="792" width="308" height="46" rx="23" fill="#F2F4F6" stroke="#D5DCE3"/>
  <text x="336" y="820" direction="rtl" text-anchor="end" font-family="'Noto Naskh Arabic', serif"
        font-size="13" fill="#8A939B">اسأل عن الثقافة التونسية…</text>
  <g stroke="#123A5C" stroke-width="1.6" fill="none">
    <!-- micro -->
    <rect x="82" y="804" width="10" height="16" rx="5"/>
    <path d="M77 816 a10 10 0 0 0 20 0"/>
    <path d="M87 826 v6"/>
  </g>
  <!-- bouton envoyer -->
  <circle cx="376" cy="815" r="19" fill="#C9A227"/>
  <path d="M384 815 l-16 -7 v5 l9 2 l-9 2 v5 z" fill="#FFFFFF"/>

  <!-- ===== barre de navigation ===== -->
  <rect x="0" y="856" width="420" height="44" fill="#123A5C"/>
  <g font-family="'Noto Naskh Arabic', serif" font-size="10" fill="#D8E6F2" text-anchor="middle">
    <!-- ordre inversé en RTL : الرئيسية à droite -->
    <g>
      <path d="M362 872 l10 -8 l10 8 v10 h-20 z" fill="none" stroke="#E3C567" stroke-width="1.4"/>
      <text x="372" y="894" fill="#E3C567">الرئيسية</text>
    </g>
    <g>
      <rect x="262" y="866" width="20" height="16" rx="3" fill="none" stroke="#D8E6F2" stroke-width="1.4"/>
      <path d="M262 872 h20" stroke="#D8E6F2" stroke-width="1.4"/>
      <text x="272" y="894">الفعاليات</text>
    </g>
    <g>
      <path d="M138 882 v-12 a3 3 0 0 1 3 -3 h16 a3 3 0 0 1 3 3 v8 a3 3 0 0 1 -3 3 h-11 z"
            fill="none" stroke="#D8E6F2" stroke-width="1.4"/>
      <text x="148" y="894">المحادثة</text>
    </g>
    <g>
      <circle cx="48" cy="871" r="5" fill="none" stroke="#D8E6F2" stroke-width="1.4"/>
      <path d="M39 883 a9 9 0 0 1 18 0" fill="none" stroke="#D8E6F2" stroke-width="1.4"/>
      <text x="48" y="894">حسابي</text>
    </g>
  </g>
</svg>
